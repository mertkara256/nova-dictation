name: CI

on:
  push:
    branches: [main]
  pull_request:

# İş akışı yalnızca kodu okur; repo ayarı değişse de fazlasını almasın.
permissions:
  contents: read

jobs:
  check:
    # Uygulama macOS ve Windows'ta çalışıyor; Windows'taki yol ve komut farkları da yakalansın.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Deneme sürümünü bozan bir değişiklik main'e girip Pages'te yayınlanmadan yakalansın.
      - run: npm run build:demo
